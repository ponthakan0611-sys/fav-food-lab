<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เมนูอาหารที่ชอบ - fav-food-lab</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      color: #efe6d2;
      font-family: system-ui, -apple-system, sans-serif;
      font-style: italic;
      /* พื้นหลังโทนดำ-เทาเข้มไล่เฉด เข้ากับกรอบสีทอง */
      background: linear-gradient(135deg, #0a0a0a 0%, #1c1915 50%, #050505 100%);
      min-height: 100vh;
    }
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .profile {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 2.5rem;
      padding: 2.5rem;
      border: 1px solid #d4af37;
      background: rgba(14, 12, 8, 0.9);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      max-width: 750px;
      width: 100%;
    }
    .photo {
      width: 200px;
      height: 250px;
      border: 2px solid #d4af37;
      padding: 4px;
      flex-shrink: 0;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .info {
      flex: 1;
    }
    .name {
      margin: 0 0 0.5rem;
      color: #d4af37;
      font-size: 2.2rem;
    }
    .subtitle {
      margin: 0 0 1.25rem;
      color: #a89f91;
      font-size: 1rem;
    }
    .menu-title {
      margin: 0 0 0.75rem;
      color: #d4af37;
      font-size: 1.15rem;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding-bottom: 0.35rem;
    }
    .meta {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin: 0 0 1.5rem;
      padding: 0;
      list-style: none;
    }
    .meta li {
      padding: 0.5rem 1rem;
      border: 1px solid #d4af37;
      background: rgba(212, 175, 55, 0.05);
      transition: background 0.2s ease;
    }
    .meta li:hover {
      background: rgba(212, 175, 55, 0.15);
    }
    .github {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border: 1px solid #d4af37;
      color: #efe6d2;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .github:hover {
      background: #d4af37;
      color: #0e0c08;
    }
    .github img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      padding: 2px;
    }
    /* ปรับให้แสดงผลสวยงามบนหน้าจอมือถือ */
    @media (max-width: 650px) {
      .profile {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="profile">
      <div class="photo">
        <!-- เปลี่ยนชื่อไฟล์รูปภาพให้ตรงกับรูปที่มีในโฟลเดอร์ -->
        <img src="66420e26-4243-46bd-a1bb-0f84b9c49994.jpg" alt="รูปโปรไฟล์">
      </div>
      <div class="info">
        <h1 class="name"><em>นายพลธกานต์ ผดุงพล</em></h1>
        <p class="subtitle">Fav Food Lab Repository</p>
        
        <h2 class="menu-title"><em>เมนูอาหารที่ชอบที่สุด 3 อย่าง</em></h2>
        <ul class="meta">
          <li><em>1. ข้าวแกงกะหรี่</em></li>
          <li><em>2. เนื้อทอด</em></li>
          <li><em>3. ข้าวมันไก่</em></li>
        </ul>

        <a class="github" href="https://github.com/ponthakan0611-sys/fav-food-lab" target="_blank">
          <img src="github.png" alt="GitHub">
          <span><em>GitHub: fav-food-lab</em></span>
        </a>
      </div>
    </div>
  </header>
</body>
</html>
